name: student_attendance_app
description: "Bilingual, Offline-First Student Attendance App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Firebase & Offline Storage
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.1
  shared_preferences: ^2.2.3

  # Hardware & Files
  mobile_scanner: ^5.1.1
  file_picker: ^8.0.3
  excel: ^4.0.3
  intl: any
  device_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
